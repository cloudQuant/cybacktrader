[build-system]
requires = [
  "setuptools>=68",
  "wheel",
  "Cython>=3.0",
  "numpy"
]
build-backend = "setuptools.build_meta"

[project]
name = "cybacktrader"
version = "0.1.0"
description = "Cython-accelerated, drop-in compatible interface for backtrader"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "cybacktrader maintainers" }]
dependencies = [
  "numpy",
]

[project.optional-dependencies]
dev = [
  "Cython>=3.0",
  "pytest>=7.0",
  "pytest-cov",
]
plotting = [
  "matplotlib",
]

[tool.setuptools.packages.find]
include = ["cybacktrader*"]


